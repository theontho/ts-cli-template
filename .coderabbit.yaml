# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
tone_instructions: |
  Be concise and direct. Focus on correctness, security, and maintainability.
  Skip nits about style/formatting (handled by Biome).

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/out/**"
    - "!**/tmp/**"
    - "!**/scratch/**"
    - "!bun.lock"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!yarn.lock"
    - "!**/*.lock"
  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        Prefer strict types — avoid `any`. Use `unknown` + narrowing for untyped boundaries.
        Redact secrets (keys, tokens, credentials) when displaying configuration.
        Greenfield project — do not suggest backward-compatibility shims.
    - path: "tests/**/*.{ts,tsx}"
      instructions: |
        bun:test. Verify both happy and error paths.
    - path: "scripts/**/*.{ts,tsx}"
      instructions: |
        Verify both interactive and non-interactive behavior.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
