name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Formatting & Lint (Biome)
        run: bun run ci:check

      - name: Type Check
        run: bun run typecheck

      - name: Run Tests (Bun)
        if: always()
        run: bun test

      - name: Build Release Binary
        run: bun run build

      - name: Smoke Test Binary
        run: ./dist/ts-cli-template --version
